<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIR AL AMAN | زر الأمان - عبدالرحمن العبسي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
:root{--red:#ef4444;--blue:#38bdf8}
body{background:#020617;color:#fff;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(1200px 600px at 50% -10%,rgba(239,68,68,0.18),transparent),radial-gradient(800px 400px at 90% 20%,rgba(56,189,248,0.12),transparent),#020617}
#canvas{position:fixed;inset:0;z-index:-1;opacity:0.6}
.nav{max-width:1280px;margin:20px auto;background:rgba(255,255,255,0.04);backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:14px 26px;display:flex;justify-content:space-between;align-items:center}
.hero{max-width:1280px;margin:0 auto;text-align:center;padding:40px 20px 20px;display:grid;grid-template-columns:1.2fr 0.8fr;gap:40px;align-items:center}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.h-left{text-align:right}
.badge{display:inline-flex;gap:8px;align-items:center;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#fca5a5;padding:7px 14px;border-radius:100px;font-size:12px;font-weight:700;letter-spacing:1px}
.h-left h1{font-size:clamp(55px,8vw,110px);font-weight:900;line-height:0.85;margin:22px 0 0;letter-spacing:-2px}

.h-left .desc{margin-top:20px;color:rgba(255,255,255,0.55);line-height:1.9;font-size:18px;max-width:520px}
.h-right{position:relative;height:460px;display:grid;place-items:center}
.core{position:relative;width:320px;height:320px;display:grid;place-items:center}
.ring{position:absolute;border-radius:50%;border:1px dashed rgba(255,255,255,0.15)}
.ring1{width:100%;height:100%;animation:spin 20s linear infinite}
.ring2{width:125%;height:125%;border-style:solid;border-color:rgba(239,68,68,0.2);animation:spin 30s linear infinite reverse}
.ring3{width:150%;height:150%;border-color:rgba(56,189,248,0.12);animation:spin 50s linear infinite}
.btn{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ff7a7a 0%,#ef4444 18%,#991b1b 62%,#450a0a 100%);border:0;box-shadow:0 0 0 10px rgba(239,68,68,0.1),0 0 0 22px rgba(239,68,68,0.05),0 20px 60px rgba(239,68,68,0.5),inset 0 6px 12px rgba(255,255,255,0.6),inset 0 -12px 24px rgba(0,0,0,0.6);font-size:84px;cursor:pointer;z-index:3;transition:0.15s;position:relative}
.btn:active{transform:scale(0.92)}
.pulse{position:absolute;inset:0;border-radius:50%;background:rgba(239,68,68,0.4);animation:pulseOut 2.2s infinite}
.metrics{max-width:1280px;margin:10px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}}
.met{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:16px 18px}
.met .k{font-family:'JetBrains Mono';font-size:11px;opacity:0.4;letter-spacing:2px}.met .v{font-size:22px;font-weight:900;margin-top:4px}.met .v span{color:var(--red)}
.cards{max-width:1280px;margin:50px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:0 20px}
@media(max-width:900px){.cards{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.07) 0%,rgba(255,255,255,0.02) 100%);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:30px;position:relative;overflow:hidden;transition:0.35s}
.card:hover{transform:translateY(-6px) scale(1.01);border-color:rgba(239,68,68,0.35);box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 40px rgba(239,68,68,0.15)}
.card .icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08)}
.card h3{margin:18px 0 10px;font-size:19px}.card p{color:rgba(255,255,255,0.5);line-height:1.8;font-size:14.5px}
.footer{margin-top:70px;border-top:1px solid rgba(255,255,255,0.06);padding:50px 20px;text-align:center;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.7))}
.owner{font-size:36px;font-weight:900;letter-spacing:-0.5px}.academy{margin-top:8px;font-size:22px;font-weight:800;color:#38bdf8;text-shadow:0 0 25px rgba(56,189,248,0.7)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulseOut{0%{transform:scale(1);opacity:0.8}100%{transform:scale(1.7);opacity:0}}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#0f172a;border:1px solid rgba(255,255,255,0.1);padding:16px 22px;border-radius:14px;display:flex;gap:14px;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,0.6);transition:0.5s cubic-bezier(0.16,1,0.3,1);z-index:99;width:min(92%,480px)}
