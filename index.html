<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>زر الأمان</title><style>body{font-family:sans-serif;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;text-align:center}.card{background:#1e293b;padding:40px 30px;border-radius:20px;max-width:400px;width:100%}button{background:#ef4444;color:#fff;border:none;padding:16px 30px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;width:100%;margin-top:20px}#result{margin-top:20px;padding:15px;background:#0f172a;border-radius:10px;border:1px solid #38bdf8;display:none}.track{font-size:22px;color:#38bdf8;margin-top:10px;font-weight:bold}</style></head><body><div class="card"><h1>🔴 زر الأمان</h1><p>منصة الإبلاغ السريع</p><button id="btn" onclick="sendReport()">إرسال بلاغ طوارئ 🚨</button><div id="result"><b>✅ تم الإرسال!</b><div class="track" id="track"></div></div></div><script>function sendReport(){const b=document.getElementById('btn');b.textContent='جاري الإرسال...';setTimeout(()=>{document.getElementById('track').textContent='رقم التتبع: SAIF-'+Math.floor(1000+Math.random()*9000);document.getElementById('result').style.display='block';b.textContent='تم ✅';b.style.background='#22c55e'},1200)}</script></body></html>
