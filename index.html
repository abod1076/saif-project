<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIR AL AMAN | عبدالرحمن العبسي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#020617;color:#fff;min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px}
h1{font-size:clamp(50px,10vw,110px);font-weight:900;line-height:0.9}
h1 span{background:linear-gradient(#fff,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff7a7a,#ef4444 20%,#7f1d1d 70%);border:0;font-size:80px;cursor:pointer;box-shadow:0 0 0 15px rgba(239,68,68,0.1),0 20px 60px rgba(239,68,68,0.5);margin:40px auto;display:grid;place-items:center;transition:.2s}
.btn:active{transform:scale(.9)}
p{color:rgba(255,255,255,0.6);max-width:500px;line-height:1.8;margin:20px auto}
.footer{margin-top:40px;opacity:0.5}
</style>
</head>
<body>
<h1>ZIR<br><span>AL AMAN</span></h1>
<button class="btn" onclick="alert('تم تفعيل زر الأمان! 🔥 - عبدالرحمن العبسي')">🛡️</button>
<p>نظام الأمان الذكي - لحماية رقمية متكاملة. اضغط زر الأمان لتفعيل الحماية الفورية.</p>
<div class="footer">عبدالرحمن العبسي | أكاديمية الأمان الرقمي</div>
</body>
</html>
