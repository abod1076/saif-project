<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zir Al Aman - THE SHOCK</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#02040a;color:#fff;font-family:'Cairo';overflow:hidden;height:100vh;cursor:crosshair}
#canvas{position:fixed;inset:0;z-index:0}
.center{position:relative;z-index:2;height:100vh;display:grid;place-items:center;text-align:center;padding:20px}
.shield-wrap{position:relative;width:340px;height:420px;margin:0 auto 20px;perspective:1000px}
.shield{width:100%;height:100%;background: radial-gradient(ellipse at center, #00e5ff22, transparent 60%), linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.2));border:2px solid #00e5ff;box-shadow:0 0 60px #00e5ff88, inset 0 0 40px #00e5ff33;border-radius:30% 30% 50% 50% / 25% 25% 70% 70%;display:grid;place-items:center;animation: float 3s ease-in-out infinite;transition:0.5s}
@keyframes float{0%,100%{transform:rotateY(-10deg) translateY(0)}50%{transform:rotateY(10deg) translateY(-15px)}}
.shield h1{font-family:'Orbitron';font-size:120px;color:#ff2a2a;text-shadow:0 0 20px #ff2a2a, 0 0 60px #ff2a2a;animation: spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h2{font-size: clamp(28px,6vw,62px);font-weight:900;line-height:1;letter-spacing:-1px}
.hero h2 b{color:#00e5ff;text-shadow:0 0 30px #00e5ff}
.sub{color:#7a8aa0;margin:14px auto;max-width:500px;line-height:1.7;font-size:14px}
.btn{margin-top:24px;padding:18px 42px;border:none;border-radius:12px;background: linear-gradient(90deg,#00e5ff,#ffd700);color:#000;font-weight:900;font-size:18px;letter-spacing:1px;box-shadow:0 0 40px #00e5ff88;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.btn:active{transform:scale(0.95)}.btn::before{content:'';position:absolute;inset:0;background: linear-gradient(90deg,transparent,rgba(255,255,255,0.6),transparent);transform:translateX(-100%);transition:.6s}
.btn:hover::before{transform:translateX(100%)}
.shock{animation: shock.6s ease}
@keyframes shock{0%{transform:scale(1)}20%{transform:scale(1.3) rotate(2deg)}40%{transform:scale(0.9) rotate(-2deg)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.flash{position:fixed;inset:0;background:#fff;z-index:99;opacity:0;pointer-events:none}
.flash.active{animation: flash.5s ease}
@keyframes flash{0%{opacity:0}10%{opacity:0.8}100%{opacity:0}}
.particle{position:absolute;width:6px;height:6px;background:#00e5ff;border-radius:50%;pointer-events:none}
.stats{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);padding:10px 16px;border-radius:10px;font-size:11px;min-width:110px}
.stat b{display:block;font-size:18px;color:#00e5ff}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="flash" id="flash"></div>
<div class="center">
<div>
<div class="shield-wrap"><div class="shield" id="shield"><h1>✶</h1></div></div>
<div class="hero">
<h2>THE FUTURE OF<br><b>CYBER DEFENSE</b></h2>
<p class="sub">ذر الأمان • نظام دفاعي صادم • عبدالرحمن العبسي - اضغط الزر وشوف الصدمة السينمائية</p>
<button class="btn" id="btn">⚡ فجّر الدرع - EXPLODE</button>
<div class="stats">
<div class="stat"><b>3.1M+</b>تهديد انصد</div>
<div class="stat"><b>99.99%</b>حماية</div>
<div class="stat"><b>9ms</b>سرعة رد</div>
</div>
</div>
</div>
</div>
<script>
const c=document.getElementById('canvas'),x=c.getContext('2d'),particles=[];
function resize(){c.width=innerWidth;c.height=innerHeight} resize(); addEventListener('resize',resize);
for(let i=0;i<120;i++)particles.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,s:Math.random()*2});
function loop(){x.clearRect(0,0,c.width,c.height);x.strokeStyle='rgba(0,229,255,0.05)';for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){let dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d=Math.hypot(dx,dy);if(d<120){x.beginPath();x.moveTo(particles[i].x,particles[i].y);x.lineTo(particles[j].x,particles[j].y);x.stroke()}}}particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>c.width)p.vx*=-1;if(p.y<0||p.y>c.height)p.vy*=-1;x.fillStyle='rgba(0,229,255,0.6)';x.beginPath();x.arc(p.x,p.y,p.s,0,Math.PI*2);x.fill()});requestAnimationFrame(loop)}loop();
const btn=document.getElementById('btn'),shield=document.getElementById('shield'),flash=document.getElementById('flash');
btn.addEventListener('click',()=>{
shield.classList.add('shock');flash.classList.add('active');
if(navigator.vibrate)navigator.vibrate([100,50,200]);
for(let i=0;i<60;i++){let d=document.createElement('div');d.className='particle';d.style.left='50%';d.style.top='50%';d.style.background=i%2?'#00e5ff':'#ff2a2a';document.body.appendChild(d);let ang=Math.random()*Math.PI*2,pow=100+Math.random()*400;d.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(ang)*pow}px), calc(-50% + ${Math.sin(ang)*pow}px)) scale(0)`,opacity:0}],{duration:800+Math.random()*700,easing:'cubic-bezier(.1,.8,.2,1)'}).onfinish=()=>d.remove()}
setTimeout(()=>{shield.classList.remove('shock');flash.classList.remove('active');btn.textContent='💥 انصدموا! مرة ثانية؟'},600)
})
</script>
</body>
</html>
